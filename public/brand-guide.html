Omitted sections (no data in brand-guide.md):
— Language rules as a separate section: folded into Voice & words,

Inferred content:
— Layout: a drafting sheet set, from the guide's own metaphor ("a
  drafting table at night"). Each section is a sheet with a title
  block in its corner, like the build drawing in the app.
— "Info" badge and alert: the guide has no info colour ("information
  is iris or plain text"), so info uses iris.
— Personality: taken from the one-line philosophy and "What this
  brand is NOT".

Fallback tokens:
— None. Every colour, font and curve below is from the guide.

Validation warnings:
— code-dim (#70748A) on code (#090A0E) is 4.29:1, AA Large only. The
  guide restricts it to line numbers; shown in the contrast table.
— Paper ink3 (#6B6E7E) on paper bg (#F6F5F1) is 4.63:1: passes AA for
  body text, with little margin. Keep it for quiet text only.

<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architect 2.0 · Brand</title>
<meta name="description" content="The Architect 2.0 brand system as a set of drawing sheets: colour, type, motion, voice and working components, in the night and paper themes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0B0C10; --surface: #0F1016; --surface2: #151720; --sunken: #1B1E29;
    --line: #212431; --line2: #2C3041; --ink: #ECEDF3; --ink2: #A4A7BA; --ink3: #808399;
    --accent: #8B93FF; --accent-ink: #C9CDFF; --accent-soft: #1C1E2F; --accent-line: #3C3F6B; --on-accent: #0B0C10;
    --ok: #3DD68C; --ok-soft: #11241F; --ok-line: #1C513A; --on-ok: #06170F;
    --warn: #F5B94A; --warn-soft: #272117; --warn-line: #5B4724;
    --bad: #FF6B6B; --bad-soft: #28171B; --bad-line: #5E2C2F;
    --code: #090A0E; --code-ink: #D4D6E2; --code-dim: #70748A;
    --grid: rgba(236, 237, 243, 0.035);
    --glow: 0 10px 30px -12px rgba(139, 147, 255, 0.55), 0 0 0 1px rgba(139, 147, 255, 0.4);
    --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.75);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --f-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --f-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--f-sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; transition: background-color 300ms var(--ease-out), color 300ms var(--ease-out);
  }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  code, .mono { font-family: var(--f-mono); }

  /* The drafting table: a faint grid under everything. */
  .table {
    display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px; background-position: -1px -1px;
  }

  /* Sheet index down the left edge, like the spine of a drawing set. */
  .index {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px;
    padding: 22px 18px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  .brandline { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15.5px; letter-spacing: -0.01em; }
  .index ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
  .index a {
    position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 16px; border-radius: 8px;
    color: var(--ink3); text-decoration: none; font-size: 13.5px; transition: color 150ms var(--ease-out), background-color 150ms var(--ease-out);
  }
  .index a:hover { color: var(--ink); background: var(--surface2); }
  .index a::before {
    content: ''; position: absolute; left: 4px; top: 50%; width: 6px; height: 1.5px; background: var(--line2);
    transform-origin: left; transition: width 260ms var(--ease-out), background-color 200ms;
  }
  .index a[aria-current='true'] { color: var(--ink); }
  .index a[aria-current='true']::before { width: 9px; background: var(--accent); }
  .index .foot { margin-top: auto; font-size: 12px; color: var(--ink3); }

  .theme-switch { position: relative; display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .theme-switch button {
    position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 500;
    color: var(--ink3); cursor: pointer;
  }
  .theme-switch button[aria-pressed='true'] { color: var(--ink); }
  .theme-switch .hl { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; background: var(--line2); transition: left 260ms var(--ease-out), width 260ms var(--ease-out); }

  .mobile-jump { display: none; }

  /* Sheets */
  main { padding: 28px clamp(16px, 4vw, 56px) 80px; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .sheet {
    position: relative; border: 1px solid var(--line2); background: color-mix(in srgb, var(--surface) 92%, transparent);
    padding: 34px clamp(18px, 3vw, 40px) 64px; scroll-margin-top: 24px;
  }
  .sheet > h2 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
  .sheet > .lede { margin: 8px 0 26px; color: var(--ink2); max-width: 62ch; font-size: 16px; }
  .titleblock {
    position: absolute; right: -1px; bottom: -1px; display: grid; grid-template-columns: auto auto; border: 1px solid var(--line2);
    font-family: var(--f-mono); font-size: 11px; color: var(--ink2); background: var(--bg);
  }
  .titleblock span { padding: 5px 10px; }
  .titleblock span + span { border-left: 1px solid var(--line2); }
  .titleblock b { color: var(--ink); font-weight: 500; }

  h3 { margin: 30px 0 12px; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
  p { margin: 0 0 12px; max-width: 68ch; }
  .muted { color: var(--ink2); }
  .quiet { color: var(--ink3); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--ink3); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line2); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }

  /* Cover */
  .cover { min-height: 72vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px; align-items: center; }
  .cover h1 { margin: 18px 0 14px; font-size: clamp(40px, 6vw, 68px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 600; }
  .cover .phil { font-size: 19px; color: var(--ink2); max-width: 34ch; }
  .cover svg.drawing { width: 100%; height: auto; }
  .drawn { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .drawn.thin { stroke-width: 1; stroke: color-mix(in srgb, var(--accent) 50%, transparent); }
  .drawn.on { stroke-dashoffset: 0; transition: stroke-dashoffset 1100ms var(--ease-out); }
  .drawing text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink2); opacity: 0; transition: opacity 500ms var(--ease-out) 400ms; }
  .drawing.done text { opacity: 1; }

  /* Idea */
  .rule { border-left: 2px solid var(--accent); padding: 4px 0 4px 16px; font-size: 18px; font-weight: 500; max-width: 50ch; }
  .spotlight { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .spotlight .ghostbox { flex: 1 1 120px; height: 44px; border: 1px dashed var(--line2); border-radius: 10px; }

  /* Logo */
  .logos { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-end; }
  .logos figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .logos figcaption { font-size: 12.5px; color: var(--ink3); font-family: var(--f-mono); }

  /* Type */
  .specimen { font-size: clamp(34px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 600; margin: 0 0 8px; }
  .scale-row { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .scale-row:last-child { border-bottom: 0; }
  .scale-row .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink3); }

  /* Colour */
  .swatch { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .swatch .chip { height: 64px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px; }
  .swatch .body { padding: 10px 12px; font-size: 13px; }
  .swatch .name { font-weight: 500; }
  .swatch .hex { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }
  .swatch .use { color: var(--ink3); font-size: 12.5px; margin-top: 2px; }
  .grade { font-family: var(--f-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.35); color: #fff; }
  .grade.fail { background: #7a1f1f; }

  /* Motion */
  .curve { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .curve:last-child { border-bottom: 0; }
  .curve svg { width: 120px; height: 90px; }
  .lane { position: relative; height: 34px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); cursor: pointer; }
  .lane .dot { position: absolute; top: 5px; left: 5px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); box-shadow: var(--glow); }
  .lane.go .dot { left: calc(100% - 27px); }
  .keyframes { display: flex; flex-wrap: wrap; gap: 10px; }
  .kf-stage { height: 110px; display: grid; place-items: center; border: 1px dashed var(--line2); border-radius: 12px; margin-top: 12px; }
  .kf-thing { padding: 8px 14px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line2); font-weight: 500; }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.96) translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(-4deg) scale(1.25); } to { opacity: 1; transform: rotate(-4deg) scale(1); } }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* Texture */
  .tex { height: 150px; border-radius: 12px; border: 1px solid var(--line); position: relative; overflow: hidden; background: var(--bg); }
  .tex.gridded { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 32px 32px; }
  .tex .label { position: absolute; left: 12px; bottom: 10px; font-size: 12.5px; color: var(--ink3); }

  /* Space and shape */
  .space-row { display: grid; grid-template-columns: 70px 1fr minmax(0, 1.4fr); gap: 14px; align-items: center; padding: 6px 0; }
  .space-bar { height: 10px; background: var(--accent); border-radius: 3px; opacity: 0.85; }
  .shape { height: 70px; border: 1.5px solid var(--accent); background: var(--accent-soft); display: grid; place-items: center; font-size: 12.5px; color: var(--accent-ink); }

  /* Components */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; font-weight: 500; cursor: pointer;
    white-space: nowrap; transition: transform 110ms var(--ease-out), background-color 150ms, border-color 150ms, color 150ms, box-shadow 150ms, filter 150ms;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
  .btn.md { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 9px; }
  .btn.lg { height: 44px; padding: 0 18px; font-size: 15px; border-radius: 11px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--glow); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.secondary { background: var(--surface2); border-color: var(--line2); color: var(--ink); }
  .btn.secondary:hover { background: var(--sunken); }
  .btn.ghost { background: transparent; color: var(--ink2); }
  .btn.ghost:hover { background: var(--surface2); color: var(--ink); }
  .btn.danger { background: var(--surface2); border-color: var(--bad-line); color: var(--bad); }
  .btn.danger:hover { background: var(--bad-soft); }
  .btn.ok { background: var(--ok); color: var(--on-ok); }
  .btn:disabled { background: var(--surface); border-color: var(--line); color: var(--ink3); box-shadow: none; cursor: not-allowed; }
  .swap { display: inline-grid; width: 16px; height: 16px; }
  .swap > * { grid-area: 1 / 1; transition: opacity 160ms var(--ease-out), transform 220ms var(--ease-out), filter 220ms var(--ease-out); }
  .swap > [data-off] { opacity: 0; transform: scale(0.6); filter: blur(3px); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin 700ms linear infinite; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 500; }
  .input, .textarea, .select {
    width: 100%; border: 1px solid var(--line2); background: var(--surface); border-radius: 10px; padding: 0 14px; font-size: 15px; font-weight: 400;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .input, .select { height: 44px; }
  .textarea { padding: 12px 14px; resize: vertical; min-height: 84px; }
  .input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14.5px; }
  .check input { position: absolute; opacity: 0; pointer-events: none; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line2); display: grid; place-items: center; transition: background-color 150ms, border-color 150ms; }
  .box svg { transform: scale(0); transition: transform 150ms var(--ease-out); }
  .check input:checked + .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .check input:checked + .box svg { transform: scale(1); }
  .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .radio .box { border-radius: 50%; }
  .radio .box::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--on-accent); transform: scale(0); transition: transform 150ms var(--ease-out); }
  .radio input:checked + .box::after { transform: scale(1); }
  .toggle { width: 40px; height: 24px; border-radius: 999px; border: 1px solid var(--line2); background: var(--sunken); position: relative; cursor: pointer; transition: background-color 200ms, border-color 200ms; padding: 0; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: var(--ink2); transition: all 200ms var(--ease-out); }
  .toggle:active::after { width: 22px; }
  .toggle[aria-checked='true'] { background: var(--accent); border-color: var(--accent); }
  .toggle[aria-checked='true']::after { left: 18px; background: var(--on-accent); }
  .toggle[aria-checked='true']:active::after { left: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; border: 1px solid; font-size: 12px; font-weight: 500; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .t-neutral { background: var(--sunken); border-color: var(--line); color: var(--ink2); }
  .t-accent, .t-info { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
  .t-ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
  .t-warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
  .t-bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
  .alert { display: block; padding: 12px 14px; border-radius: 12px; border: 1px solid; font-size: 14px; }
  .alert b { font-weight: 600; }
  .tooltip-wrap { position: relative; display: inline-flex; }
  .tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 240px; background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 500; padding: 6px 10px; border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity 150ms; }
  .tooltip.show { opacity: 1; }
  .seg { position: relative; display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--ink3); cursor: pointer; transition: color 200ms; }
  .seg button[aria-selected='true'] { color: var(--ink); }
  .seg .hl { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; background: var(--line2); transition: left 260ms var(--ease-out), width 260ms var(--ease-out); }
  .crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink3); }
  .crumbs a { color: var(--ink2); text-decoration: none; }
  .crumbs a:hover { color: var(--ink); }
  .pages { display: inline-flex; gap: 4px; }
  .pages button { min-width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .pages button[aria-current='page'] { background: var(--line2); border-color: var(--line2); }
  .bar { height: 6px; border-radius: 999px; background: var(--line2); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 600ms var(--ease-out); }
  .avatar { display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--line2); font-weight: 600; }
  .hold {
    position: relative; overflow: hidden; width: 100%; max-width: 440px; height: 60px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent);
    font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: var(--glow);
    touch-action: none; user-select: none; transition: transform 150ms var(--ease-out), background-color 200ms;
  }
  .hold.holding { transform: scale(0.985); }
  .hold.done { background: var(--ok); color: var(--on-ok); box-shadow: none; }
  .hold .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255, 255, 255, 0.15); }
  .hold > span { position: relative; display: inline-flex; align-items: center; }
  .toaster { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface2); box-shadow: var(--shadow); font-size: 14px; animation: toast-in 260ms var(--ease-out) both; }
  .toast .count { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: color-mix(in srgb, var(--accent) 70%, transparent); transform-origin: left; }
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.6); display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
  .scrim.open { display: flex; }
  .modal { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow); animation: pop-in 150ms var(--ease-out) both; }
  .modal header { padding: 20px 22px 4px; }
  .modal h4 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .modal .mbody { padding: 10px 22px 18px; color: var(--ink2); }
  .modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); }

  /* Surfaces: little wireframes of the five layouts */
  .wire { height: 132px; border: 1px solid var(--line2); border-radius: 10px; background: var(--bg); position: relative; overflow: hidden; }
  .wire i { position: absolute; display: block; border-radius: 3px; background: var(--line2); }
  .wire i.acc { background: var(--accent); }
  .wire.paperish { background: #F6F5F1; border-color: #D3D1C8; }

  .wire.paperish i.acc { background: #4B55D9; }

  /* Contrast checker */
  .checker { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-items: end; }
  .preview { border-radius: 12px; border: 1px solid var(--line); padding: 18px; min-height: 92px; display: flex; flex-direction: column; justify-content: center; }
  .ratio { font-family: var(--f-mono); font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }

  .not { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 17px; }
  .not li { display: flex; gap: 12px; align-items: baseline; }
  .not li::before { content: ''; flex: none; width: 14px; height: 2px; background: var(--bad); transform: translateY(-4px); }

  @media (max-width: 900px) {
    .table { grid-template-columns: 1fr; }
    .index { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; border-right: 0; border-bottom: 1px solid var(--line); }
    .index ol, .index .foot { display: none; }
    .mobile-jump { display: block; width: 100%; }
    .cover { grid-template-columns: 1fr; min-height: auto; }
    .scale-row, .curve { grid-template-columns: 1fr; }
    .space-row { grid-template-columns: 60px 1fr; }
    .space-row .quiet { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>

const brand = {

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs = {}, html = '') => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (html) n.innerHTML = html; return n; };
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let theme = 'night';

function lum(hex) {
  const h = hex.replace('#', '');
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function ratio(a, b) { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); }
function grade(r) { return r >= 7 ? 'AAA' : r >= 4.5 ? 'AA' : r >= 3 ? 'AA Large' : 'Fail'; }

function mark(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#15171F" stroke="#2C3041"/><path d="M8.5 23 L16 8.5 L23.5 23" fill="none" stroke="#ECEDF3" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M11.8 17.4 H20.2" stroke="#8B93FF" stroke-width="2.6" stroke-linecap="round"/></svg>`;
}
const ICON = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>',
};
const icon = (name, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

function applyTheme(name) {
  theme = name;
  const c = brand.colors[name];
  const root = document.documentElement;
  root.dataset.theme = name;
  root.style.colorScheme = name === 'paper' ? 'light' : 'dark';
  for (const [k, v] of Object.entries(c)) root.style.setProperty(`--${k}`, v);
  const ink = c.ink;
  root.style.setProperty('--grid', name === 'paper' ? 'rgba(23, 24, 30, 0.05)' : 'rgba(236, 237, 243, 0.035)');
  root.style.setProperty('--glow', name === 'paper' ? '0 10px 24px -14px rgba(75, 85, 217, 0.6)' : '0 10px 30px -12px rgba(139, 147, 255, 0.55), 0 0 0 1px rgba(139, 147, 255, 0.4)');
  root.style.setProperty('--shadow', name === 'paper' ? '0 24px 60px -28px rgba(23, 24, 30, 0.35)' : '0 24px 60px -24px rgba(0, 0, 0, 0.75)');
  $$('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === name)));
  moveHighlight($('.theme-switch'), $(`[data-theme-btn="${name}"]`));
  paintSwatches(ink);
  paintChecker();
}

function moveHighlight(wrap, btn) {
  const hl = $('.hl', wrap);
  if (!hl || !btn) return;
  hl.style.left = `${btn.offsetLeft}px`;
  hl.style.width = `${btn.offsetWidth}px`;
}

function sheet(id, title, lede) {
  const s = el('section', { class: 'sheet', id, 'aria-labelledby': `${id}-h` });
  if (title) s.appendChild(el('h2', { id: `${id}-h` }, title));
  if (lede) s.appendChild(el('p', { class: 'lede' }, lede));
  return s;
}

function paintSwatches(ink) {
  $$('.swatch[data-token]').forEach((sw) => {
    const t = sw.dataset.token;
    const hex = brand.colors[theme][t];
    $('.hex', sw).textContent = hex;

/* hold to confirm */
(function () {
  const btn = $('#hold');
  const fill = $('.fill', btn);
  const ring = $('#ring');
  const label = $('#hold-l');
  const MS = 1100;
  let p = 0; let raf = 0; let done = false;
  const set = (v) => { p = v; fill.style.width = `${v * 100}%`; ring.setAttribute('stroke-dashoffset', String(88 * (1 - v))); };
  const begin = () => {
    if (done) return;
    btn.classList.add('holding'); label.textContent = 'Keep holding…';
    cancelAnimationFrame(raf);
    const from = p; const t0 = performance.now();
    const step = (now) => {
      const v = Math.min(1, from + (now - t0) / MS);
      set(v);
      if (v >= 1) {
        done = true; btn.classList.remove('holding'); btn.classList.add('done'); label.textContent = 'Live for everyone';
        setTimeout(() => { done = false; btn.classList.remove('done'); set(0); label.textContent = 'Hold to go live'; }, 2400);
        return;
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };
  const release = () => {
    if (done) return;
    btn.classList.remove('holding'); label.textContent = 'Hold to go live';
    cancelAnimationFrame(raf);
    const from = p; const t0 = performance.now();
    const back = (now) => { const k = Math.min(1, (now - t0) / 180); set(from * (1 - k)); if (k < 1) raf = requestAnimationFrame(back); };
    raf = requestAnimationFrame(back);
  };
  btn.addEventListener('pointerdown', (e) => { if (e.button !== 0) return; btn.setPointerCapture(e.pointerId); begin(); });
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } });
  btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
})();

  t.addEventListener('pointerenter', () => { clearTimeout(timer); left -= Date.now() - started; count.style.animationPlayState = 'paused'; });

});

  const tabs = $$('button', seg);
  const place = (b) => moveHighlight(seg, b);
  tabs.forEach((b) => b.addEventListener('click', () => { tabs.forEach((x) => x.setAttribute('aria-selected', String(x === b))); place(b); }));
  requestAnimationFrame(() => place(tabs[0]));
})();

/* pagination */
$$('.pages button').forEach((b) => b.addEventListener('click', () => { $$('.pages button').forEach((x) => x.removeAttribute('aria-current')); b.setAttribute('aria-current', 'page'); }));

/* progress fills as it scrolls into view */
new IntersectionObserver((es, obs) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  obs.disconnect();
  let n = 0;
  const bar = $('#bar');
  const tick = setInterval(() => { n += 1; $('i', bar).style.width = `${(n / 15) * 100}%`; bar.setAttribute('aria-valuenow', String(Math.round((n / 15) * 100))); $('#bar-n').textContent = n; if (n >= 12) clearInterval(tick); }, calm ? 1 : 120);
}), { threshold: 0.6 }).observe($('#bar'));

/* contrast checker */
$('#fg').value = 'ink3'; $('#bgsel').value = 'bg';
['#fg', '#bgsel'].forEach((s) => $(s).addEventListener('change', paintChecker));

applyTheme('night');
window.addEventListener('resize', () => { moveHighlight($('.theme-switch'), $(`[data-theme-btn="${theme}"]`)); moveHighlight($('.seg'), $('.seg [aria-selected="true"]')); });
</script>
</body>
</html>
